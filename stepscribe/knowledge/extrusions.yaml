# Aluminium T-slot profiles. Rule 8: every entry has a `source`.
# outer_mm = [width, height] of the cross-section; slot_width_mm = slot opening; bore_mm = centre bore.
# TODO: verify slot_width_mm and bore_mm for 3030 and 4040 (catalogues differ between 8 / 8.2 mm and
#   6.8 / 8.5 mm); only the outer size is matched for those until sourced.
kind: extrusion_profile
entries:
  "2020":
    label: 2020 aluminium extrusion
    outer_mm: [20.0, 20.0]
    slot_width_mm: 6.2
    bore_mm: 4.2
    source: "Misumi HFS5-2020 and Bosch Rexroth 20x20 catalogue drawings (slot 6.2 mm, M5 tap bore 4.2 mm)"
  "2040":
    label: 2040 aluminium extrusion
    outer_mm: [20.0, 40.0]
    slot_width_mm: 6.2
    bore_mm: 4.2
    source: "Misumi HFS5-2040 catalogue drawing (slot 6.2 mm, M5 tap bore 4.2 mm)"
  "3030":
    label: 3030 aluminium extrusion
    outer_mm: [30.0, 30.0]
    source: "Misumi HFS6-3030 catalogue drawing (outer size only; slot and bore TODO: verify)"
  "4040":
    label: 4040 aluminium extrusion
    outer_mm: [40.0, 40.0]
    source: "Misumi HFS8-4040 catalogue drawing (outer size only; slot and bore TODO: verify)"
