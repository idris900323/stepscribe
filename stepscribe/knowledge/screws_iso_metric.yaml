# ISO metric screw reference data. Rule 8: every entry carries a `source`.
# Columns (mm):
#   nominal  - major thread diameter (ISO 261 / ISO 262)
#   pitch    - coarse pitch (ISO 261)
#   close / normal / loose - clearance hole, ISO 273 fine / medium / coarse series
#   tap_drill - tapping drill for coarse thread, ~75 % thread (ISO 2306 / Machinery's Handbook)
#   cbore_d  - counterbore diameter for ISO 4762 socket head cap screws (DIN 974-1 / ISO 4762 annex)
#   head_d / head_k - ISO 4762 max head diameter and height
#   nut_m    - ISO 4032 max nut height
# TODO: verify cbore_d for M20 and M24 before adding; counterbore depths intentionally omitted.
standard: ISO metric
source_default: "ISO 273 (clearance), ISO 261 (nominal, pitch), ISO 4762 (head), ISO 4032 (nut)"
sizes:
